name: erpnext

# ERPNext v16 stack for SWE-Pioneers (erp.swe.com.ly).
# Uses a custom image baked from frappe/erpnext:v16.26.2 + hrms + shariah_compliance
# (see Containerfile). hrms + shariah_compliance are baked in AND installed on the site
# by the configurator (validated on v16) — see its --install-app list below.
#
# Resource limits (memory caps + Redis maxmemory/eviction) protect the 16 GB / 4 vCPU VPS.

x-image: &image
  image: erpnext-swe:v16.26.2-swe2   # corrected assets (frappe+erpnext+hrms, bench build --force); :swe1 shipped broken CSS + missing hrms — kept on box for rollback
  pull_policy: never          # locally-built image; never attempt a registry pull
  restart: unless-stopped

x-backend: &backend
  <<: *image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  environment:
    PYTHONPATH: /home/frappe/frappe-bench/apps
  networks:
    - frappe_internal
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  mariadb:
    image: mariadb:11.8
    container_name: erpnext-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?required}
      MARIADB_ROOT_HOST: "%"
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - frappe_internal

  redis-cache:
    image: redis:7-alpine
    container_name: erpnext-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 1500mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - frappe_internal

  redis-queue:
    image: redis:7-alpine
    container_name: erpnext-redis-queue
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 500mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - redis-queue-data:/data
    networks:
      - frappe_internal

  configurator:
    <<: *image
    container_name: erpnext-configurator
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        # erpnext + hrms + shariah_compliance — all validated on v16.
        printf 'erpnext\nhrms\nshariah_compliance\n' > sites/apps.txt
        if [ ! -f sites/common_site_config.json ]; then echo '{}' > sites/common_site_config.json; fi
        bench set-config -gp reverse_proxy 1
        bench set-config -g db_host mariadb
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://redis-cache:6379"
        bench set-config -g redis_queue "redis://redis-queue:6379"
        bench set-config -g redis_socketio "redis://redis-queue:6379"
        bench set-config -gp socketio_port 9000
        if [ ! -d "sites/$$SITE_NAME" ]; then
          bench new-site "$$SITE_NAME" \
            --db-name "$$SITE_DB_NAME" \
            --db-password "$$DB_PASSWORD" \
            --db-root-username root \
            --mariadb-root-password "$$DB_PASSWORD" \
            --admin-password "$$ADMIN_PASSWORD" \
            --db-host mariadb --db-port 3306 \
            --install-app erpnext \
            --install-app hrms \
            --install-app shariah_compliance \
            --set-default
          # new-site pins the site DB user to the creating container's IP; grant @% so the
          # backend + workers (different IPs) can connect too.
          mysql -h mariadb -uroot -p"$$DB_PASSWORD" -e "CREATE USER IF NOT EXISTS '$$SITE_DB_NAME'@'%' IDENTIFIED BY '$$DB_PASSWORD'; GRANT ALL PRIVILEGES ON \`$$SITE_DB_NAME\`.* TO '$$SITE_DB_NAME'@'%'; FLUSH PRIVILEGES;"
          echo "Site $$SITE_NAME created with erpnext + hrms + shariah_compliance."
        fi
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps
      DB_PASSWORD: ${DB_PASSWORD:?required}
      SITE_NAME: ${SITE_NAME:?required}
      SITE_DB_NAME: ${SITE_DB_NAME:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - frappe_internal

  backend:
    <<: *backend
    container_name: erpnext-backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -f -H "Host: ${SITE_NAME}" http://localhost:8000/api/method/frappe.ping'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    <<: *image
    container_name: erpnext-frontend
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?required}
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/method/frappe.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started
    networks:
      - frappe_internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.erpnext.rule: "Host(`${SITE_NAME}`)"
      traefik.http.routers.erpnext.entrypoints: "websecure"
      traefik.http.routers.erpnext.tls: "true"
      traefik.http.routers.erpnext.tls.certresolver: "letsencrypt"
      traefik.http.routers.erpnext.middlewares: "secure-headers,rate-limit"
      traefik.http.routers.erpnext.service: "erpnext"
      traefik.http.services.erpnext.loadbalancer.server.port: "8080"
      # WebSocket router (socket.io): no rate-limit. Target 8080 (frontend nginx), which proxies
      # /socket.io -> websocket:9000 internally. Targeting :9000 here = nothing listens -> 502.
      traefik.http.routers.erpnext-ws.rule: "Host(`${SITE_NAME}`) && PathPrefix(`/socket.io`)"
      traefik.http.routers.erpnext-ws.entrypoints: "websecure"
      traefik.http.routers.erpnext-ws.tls: "true"
      traefik.http.routers.erpnext-ws.tls.certresolver: "letsencrypt"
      traefik.http.routers.erpnext-ws.priority: "100"
      traefik.http.routers.erpnext-ws.service: "erpnext-ws"
      traefik.http.services.erpnext-ws.loadbalancer.server.port: "8080"

  websocket:
    <<: *backend
    container_name: erpnext-websocket
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue-short:
    <<: *backend
    container_name: erpnext-queue-short
    command: ["bench", "worker", "--queue", "short,default"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue-long:
    <<: *backend
    container_name: erpnext-queue-long
    command: ["bench", "worker", "--queue", "long,default,short"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    <<: *backend
    container_name: erpnext-scheduler
    command: ["bench", "schedule"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
  frappe_internal:
    name: frappe_internal

volumes:
  mariadb-data:
  redis-queue-data:
  sites:
